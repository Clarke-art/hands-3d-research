<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌侧指根 · 三个角度视觉验收</title><style>body{margin:0;background:#111923;color:#e4edf5;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1480px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#bfcedb}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;border:1px solid #415a70;border-radius:7px;background:#213449;color:#e5eff7;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#347ba4;border-color:#69b9e7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair figure{margin:0;background:#1c2835;border-radius:8px;overflow:hidden}figcaption{padding:9px 14px;font-weight:600}.pair img{display:block;width:100%;height:auto;cursor:zoom-in}.decision{background:#1b2a38;border:1px solid #3b5165;border-radius:8px;padding:18px;margin-top:24px}.answers{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}.answers div{display:flex;gap:10px;flex-wrap:wrap}textarea{width:100%;box-sizing:border-box;background:#101c27;color:#e5edf5;border:1px solid #45596a;border-radius:6px;padding:10px;font:inherit}button:disabled{opacity:.45;cursor:default}.small{font-size:13px}a{color:#90d2f5}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><main><h1>掌侧指根 · Human 视觉验收</h1><p>重点看修复后是否自然，有没有明显台阶、异常pinch、折面或穿模；下方正常区域和相邻指根是否正常。自然褶皱、轻微压缩和低模感可以接受。</p><div class="toolbar" id="poses"><button data-pose="MID_MCP_15" aria-pressed="false">15°</button><button data-pose="MID_MCP_30" aria-pressed="false">30°</button><button data-pose="MID_MCP_45" aria-pressed="true">45° · 重点</button><select id="view" aria-label="查看机位"><option value="ROOT_CLOSE">指根近景实体</option><option value="FULL_HAND">全手实体</option><option value="ALTERNATE">Alternate view</option><option value="GRAZING">Grazing</option></select><span id="caption">MID_MCP_45</span></div><div class="pair"><figure><figcaption>当前修复前 · PRE-PALMAR</figcaption><a id="beforeLink" target="_blank"><img id="before" alt="修复前普通实体"></a></figure><figure><figcaption>当前修复后 · REPAIRED PALMAR</figcaption><a id="afterLink" target="_blank"><img id="after" alt="修复后普通实体"></a></figure></div><p class="small">同一pose两列使用相同机位、灯光、尺度和实体材质。点击图片看原尺寸。三个角度已完成最低安全检查并恢复ZERO；最终接受权由你判断。</p><form class="decision" id="approval"><strong>逐角度判断修复后的产品视觉质量</strong><div class="answers"><div><strong>15°</strong><label><input type="radio" name="MID_MCP_15" value="ACCEPT" required>接受</label><label><input type="radio" name="MID_MCP_15" value="VISIBLE_PROBLEM" required>有明显问题</label></div><div><strong>30°</strong><label><input type="radio" name="MID_MCP_30" value="ACCEPT" required>接受</label><label><input type="radio" name="MID_MCP_30" value="VISIBLE_PROBLEM" required>有明显问题</label></div><div><strong>45°</strong><label><input type="radio" name="MID_MCP_45" value="ACCEPT" required>接受</label><label><input type="radio" name="MID_MCP_45" value="VISIBLE_PROBLEM" required>有明显问题</label></div></div><label>若有明显问题，请描述角度、位置和看到的现象<textarea id="notes" rows="3"></textarea></label><p><button id="download" type="submit" disabled>下载 Human review 响应</button></p><p class="small">三个选项均无默认答案。下载响应不会自动修复、推进NEXT或关闭current9。全部接受后，下一阶段才是整只手Human-visible surface总检。</p><p id="result" role="status"></p></form></main><script>const pictures={"MID_MCP_15": {"FULL_HAND": {"PRE_PALMAR": "renders/MID_MCP_15__FULL_HAND__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_15__FULL_HAND__REPAIRED_PALMAR.png"}, "ROOT_CLOSE": {"PRE_PALMAR": "renders/MID_MCP_15__ROOT_CLOSE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_15__ROOT_CLOSE__REPAIRED_PALMAR.png"}, "ALTERNATE": {"PRE_PALMAR": "renders/MID_MCP_15__ALTERNATE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_15__ALTERNATE__REPAIRED_PALMAR.png"}, "GRAZING": {"PRE_PALMAR": "renders/MID_MCP_15__GRAZING__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_15__GRAZING__REPAIRED_PALMAR.png"}}, "MID_MCP_30": {"FULL_HAND": {"PRE_PALMAR": "renders/MID_MCP_30__FULL_HAND__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_30__FULL_HAND__REPAIRED_PALMAR.png"}, "ROOT_CLOSE": {"PRE_PALMAR": "renders/MID_MCP_30__ROOT_CLOSE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_30__ROOT_CLOSE__REPAIRED_PALMAR.png"}, "ALTERNATE": {"PRE_PALMAR": "renders/MID_MCP_30__ALTERNATE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_30__ALTERNATE__REPAIRED_PALMAR.png"}, "GRAZING": {"PRE_PALMAR": "renders/MID_MCP_30__GRAZING__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_30__GRAZING__REPAIRED_PALMAR.png"}}, "MID_MCP_45": {"FULL_HAND": {"PRE_PALMAR": "renders/MID_MCP_45__FULL_HAND__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_45__FULL_HAND__REPAIRED_PALMAR.png"}, "ROOT_CLOSE": {"PRE_PALMAR": "renders/MID_MCP_45__ROOT_CLOSE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_45__ROOT_CLOSE__REPAIRED_PALMAR.png"}, "ALTERNATE": {"PRE_PALMAR": "renders/MID_MCP_45__ALTERNATE__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_45__ALTERNATE__REPAIRED_PALMAR.png"}, "GRAZING": {"PRE_PALMAR": "renders/MID_MCP_45__GRAZING__PRE_PALMAR.png", "REPAIRED_PALMAR": "renders/MID_MCP_45__GRAZING__REPAIRED_PALMAR.png"}}};const assets={"PRE_PALMAR": {"path": "<HANDS_ROOT>\\production_spec\\stage5_production_rig\\geometry_propagation_after_donor_transfer_r1\\RIGHT_HAND_STAGE5B_R2_DONOR_TRANSFER_GEOMETRY_R1.blend", "sha256": "d8ea48d5d09635a46aebabb7a6e516f2a2a8599c92f2ca68489cdbeb0ec6866d"}, "REPAIRED_PALMAR": {"path": "<HANDS_ROOT>\\production_spec\\stage5_production_rig\\geometry_propagation_after_palmar_donor_restoration_r1\\RIGHT_HAND_STAGE5B_R2_DONOR_TRANSFER_PALMAR_ROOT_GEOMETRY_R1.blend", "sha256": "90d3ebd1c1973f94020b66281781db481d5a366271a9d6aac6b921861e2b45aa"}};const cases=['MID_MCP_15','MID_MCP_30','MID_MCP_45'];let pose='MID_MCP_45';const select=document.getElementById('view');function show(){const row=pictures[pose][select.value];for(const [key,asset] of [['before','PRE_PALMAR'],['after','REPAIRED_PALMAR']]){document.getElementById(key).src=row[asset];document.getElementById(key+'Link').href=row[asset]}document.getElementById('caption').textContent=pose;document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===pose)))}document.getElementById('poses').addEventListener('click',e=>{const b=e.target.closest('[data-pose]');if(b){pose=b.dataset.pose;show()}});select.addEventListener('change',show);show();const form=document.getElementById('approval');const btn=document.getElementById('download');form.addEventListener('change',()=>{btn.disabled=!cases.every(c=>form.querySelector('input[name="'+c+'"]:checked'))});form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const answers=Object.fromEntries(cases.map(c=>[c,form.querySelector('input[name="'+c+'"]:checked').value]));const all=Object.values(answers).every(x=>x==='ACCEPT');const response={phase:'PALMAR_ROOT_TARGETED_VISUAL_DEFORMATION_R1',review_id:'PALMAR_ROOT_THREE_POSE_HUMAN_VISUAL_REVIEW_R1',acceptance_policy:'HUMAN_VISIBLE_PRODUCT_QUALITY_FIRST',assets,pose_answers:answers,all_three_visually_approved:all,notes:document.getElementById('notes').value,timestamp:new Date().toISOString(),automatic_apply:false,current9_closure_approved:false,production_promotion_approved:false,authorized_next_phase:all?'WHOLE_HAND_SURFACE_INTEGRITY_BASELINE_R1':null};const blob=new Blob([JSON.stringify(response,null,2)+String.fromCharCode(10)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='PALMAR_ROOT_THREE_POSE_HUMAN_VISUAL_RESPONSE_R1.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('result').textContent='响应已下载；未自动执行任何后续阶段。'});</script></html>
